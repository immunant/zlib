[package]
name = "zlib"
authors = [ "C2Rust",]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "zlib"
path = "lib.rs"
crate-type = [ "cdylib",]

[dependencies]
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
miniz_oxide = "0.9.1"
rustix = { version = "1", features = ["fs"] }

[workspace]
members = []
default-members = [ ".",]

[profile.release]
strip = "debuginfo"
